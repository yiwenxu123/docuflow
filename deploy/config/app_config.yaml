# DocuFlow 应用配置文件
# 这个文件展示了如何配置应用的各个方面

# 转换配置
conversion:
  # 支持的输入格式
  supported_input_formats:
    - ".txt"
    - ".md"
    - ".html"
    - ".pdf"
    - ".docx"
    - ".rtf"
  
  # 支持的输出格式
  supported_output_formats:
    - ".md"
    - ".html"
    - ".pdf"
    - ".txt"
    - ".docx"
  
  # 默认输出格式
  default_output_format: ".md"
  
  # 最大文件大小 (MB)
  max_file_size_mb: 100
  
  # 批量处理的最大文件数
  max_batch_size: 50
  
  # 临时文件目录
  temp_directory: "./temp"
  
  # 输出目录
  output_directory: "./output"
  
  # 是否保留原始文件结构
  preserve_structure: true
  
  # 转换质量设置
  quality_settings:
    # 图像质量 (1-100)
    image_quality: 85
    # 是否保留元数据
    preserve_metadata: true
    # 是否优化输出大小
    optimize_size: false

# 日志配置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  
  # 日志格式
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # 日志文件路径
  file_path: "./logs/docuflow.log"
  
  # 是否启用控制台输出
  console_output: true
  
  # 是否启用文件输出
  file_output: true
  
  # 日志文件最大大小 (MB)
  max_file_size_mb: 10
  
  # 保留的日志文件数量
  backup_count: 5
  
  # 是否启用结构化日志
  structured_logging: true
  
  # 日志轮转设置
  rotation:
    # 轮转类型: size, time
    type: "size"
    # 轮转间隔 (对于时间轮转: daily, weekly, monthly)
    interval: "daily"

# 安全配置
security:
  # 是否启用文件类型验证
  validate_file_types: true
  
  # 允许的文件扩展名
  allowed_extensions:
    - ".txt"
    - ".md"
    - ".html"
    - ".pdf"
    - ".docx"
    - ".rtf"
  
  # 是否扫描恶意内容
  scan_malicious_content: true
  
  # 是否启用沙箱模式
  sandbox_mode: false
  
  # 最大处理时间 (秒)
  max_processing_time: 300
  
  # 是否记录安全事件
  log_security_events: true

# 性能配置
performance:
  # 并发处理的最大线程数
  max_workers: 4
  
  # 内存使用限制 (MB)
  memory_limit_mb: 512
  
  # 是否启用缓存
  enable_caching: true
  
  # 缓存大小 (MB)
  cache_size_mb: 100
  
  # 缓存过期时间 (秒)
  cache_ttl: 3600
  
  # 是否启用性能监控
  enable_monitoring: true
  
  # 性能报告间隔 (秒)
  monitoring_interval: 60
  
  # 是否启用预加载
  enable_preloading: false
  
  # 处理超时时间 (秒)
  processing_timeout: 120

# UI配置
ui:
  # 主题: light, dark, auto
  theme: "auto"
  
  # 语言: zh-CN, en-US
  language: "zh-CN"
  
  # 窗口大小
  window_size:
    width: 1200
    height: 800
  
  # 是否记住窗口位置
  remember_window_position: true
  
  # 是否显示进度条
  show_progress_bar: true
  
  # 是否显示预览
  show_preview: true
  
  # 自动保存间隔 (秒)
  auto_save_interval: 30
  
  # 最近文件列表大小
  recent_files_count: 10
  
  # 是否启用拖拽功能
  enable_drag_drop: true
  
  # 默认视图模式: list, grid, tree
  default_view_mode: "list"

# 应用配置
app:
  # 应用名称
  name: "DocuFlow"
  
  # 应用版本
  version: "1.0.0"
  
  # 是否启用调试模式
  debug: false
  
  # 是否启用开发模式
  development: false
  
  # 配置文件版本
  config_version: "1.0"
  
  # 数据目录
  data_directory: "./data"
  
  # 插件目录
  plugins_directory: "./plugins"
  
  # 是否启用插件系统
  enable_plugins: false
  
  # 是否检查更新
  check_updates: true
  
  # 更新检查间隔 (小时)
  update_check_interval: 24
  
  # 是否发送使用统计
  send_analytics: false
  
  # 是否启用崩溃报告
  crash_reporting: true

# 外部工具配置
external_tools:
  # Pandoc配置
  pandoc:
    # Pandoc可执行文件路径
    executable_path: "pandoc"
    # 是否启用Pandoc
    enabled: true
    # 额外参数
    extra_args: []
  
  # LibreOffice配置
  libreoffice:
    # LibreOffice可执行文件路径
    executable_path: "libreoffice"
    # 是否启用LibreOffice
    enabled: false
    # 无头模式
    headless: true
  
  # ImageMagick配置
  imagemagick:
    # ImageMagick可执行文件路径
    executable_path: "convert"
    # 是否启用ImageMagick
    enabled: false

# 网络配置
network:
  # 代理设置
  proxy:
    # 是否启用代理
    enabled: false
    # 代理类型: http, https, socks5
    type: "http"
    # 代理地址
    host: ""
    # 代理端口
    port: 8080
    # 代理用户名
    username: ""
    # 代理密码
    password: ""
  
  # 超时设置
  timeout:
    # 连接超时 (秒)
    connect: 10
    # 读取超时 (秒)
    read: 30
  
  # 重试设置
  retry:
    # 最大重试次数
    max_attempts: 3
    # 重试延迟 (秒)
    delay: 1
    # 退避因子
    backoff_factor: 2

# 备份配置
backup:
  # 是否启用自动备份
  enabled: false
  
  # 备份目录
  directory: "./backups"
  
  # 备份间隔 (小时)
  interval: 24
  
  # 保留的备份数量
  keep_count: 7
  
  # 是否压缩备份
  compress: true
  
  # 备份文件名格式
  filename_format: "backup_%Y%m%d_%H%M%S"

# 实验性功能
experimental:
  # 是否启用实验性功能
  enabled: false
  
  # 实验性功能列表
  features:
    - "ai_content_analysis"
    - "batch_ocr"
    - "smart_formatting"
  
  # 实验性功能的配置
  ai_content_analysis:
    enabled: false
    model: "gpt-3.5-turbo"
    api_key: ""
  
  batch_ocr:
    enabled: false
    engine: "tesseract"
    languages: ["chi_sim", "eng"]
  
  smart_formatting:
    enabled: false
    auto_detect_structure: true
    preserve_formatting: true